name: Carokaz Mada — SEO catalogue

on:
  workflow_dispatch:
    inputs:
      apply_fixes:
        description: "Appliquer les corrections Shopify mutatives"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: carokaz-seo-${{ github.ref }}
  cancel-in-progress: false

env:
  SHOPIFY_SHOP: carokazmada-store.myshopify.com
  SHOPIFY_API_VERSION: "2025-07"
  SITE_URL: https://carokazmada.com
  GSC_SITE_URL: sc-domain:carokazmada.com
  NO_COLOR: "1"
  SEO_AUDIT_PATHS: "/,/collections/vehicules-disponibles,/collections/fiara-vaovao,/collections/citadines,/collections/suv,/collections/4x4,/collections/pick-up,/blogs/actualites,/blogs/actualites/fiara-amidy-madagascar-guide-achat-antananarivo,/pages/fiara-amidy-madagascar,/pages/a-propos,/pages/contact,/pages/faq"

jobs:
  public-seo-crawl:
    name: Crawl public et rapport d’indexabilité
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carokaz-autoconfig
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Installer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: carokaz-autoconfig/requirements.lock

      - name: Installer les dépendances
        run: pip install --require-hashes -r requirements.lock

      - name: Exécuter le crawl public
        run: python carokaz_setup.py --only T11 --dry-run

      - name: Publier le rapport public
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: carokaz-public-seo-rapport-${{ github.run_number }}
          path: carokaz-autoconfig/rapports/
          if-no-files-found: warn
          retention-days: 30

  search-console-report:
    name: Rapport Search Console Madagascar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carokaz-autoconfig
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: carokaz-autoconfig/requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Préparer les identifiants Search Console
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            mkdir -p rapports
            printf '# Carokaz Mada — Diagnostic Search Console\\n\\nStatut : DIFFÉRÉ\\n\\nLe secret `GOOGLE_SERVICE_ACCOUNT_JSON` n’est pas configuré ; le crawl public reste actif.\\n' > "rapports/rapport-search-console-${GITHUB_RUN_ID}.md"
          else
            printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/google-service-account.json"
          fi

      - name: Collecter les performances Search Console
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ runner.temp }}/google-service-account.json
        run: python carokaz_setup.py --only T12

      - name: Publier le rapport Search Console
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carokaz-search-console-rapport-${{ github.run_number }}
          path: carokaz-autoconfig/rapports/
          if-no-files-found: warn
          retention-days: 30

  shopify-seo:
    name: Audit et corrections Shopify
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_fixes == true }}
    environment: shopify-production
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carokaz-autoconfig
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Installer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: carokaz-autoconfig/requirements.lock

      - name: Installer les dépendances
        run: pip install --require-hashes -r requirements.lock

      - name: Vérifier le secret Shopify
        id: shopify_preflight
        env:
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
        run: |
          if [ -z "$SHOPIFY_ADMIN_TOKEN" ]; then
            mkdir -p rapports
            printf '# Carokaz Mada — Diagnostic Shopify\n\nStatut : DIFFÉRÉ\n\nLe secret `SHOPIFY_ADMIN_TOKEN` n’est pas configuré dans GitHub Actions ; l’hygiène Shopify sera reprise automatiquement dès son ajout.\n' > "rapports/rapport-preflight-${GITHUB_RUN_ID}.md"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Le secret SHOPIFY_ADMIN_TOKEN n'est pas configuré ; le job Shopify est différé."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "Secret Shopify détecté (valeur masquée)."

      - name: Exécuter l’hygiène SEO Shopify
        if: steps.shopify_preflight.outputs.configured == 'true'
        env:
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
        run: python carokaz_setup.py --only T2,T5,T8,T9,T10

      - name: Publier le rapport Shopify
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: carokaz-shopify-seo-rapport-${{ github.run_number }}
          path: carokaz-autoconfig/rapports/
          if-no-files-found: warn
          retention-days: 30
