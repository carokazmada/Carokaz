name: Carokaz Mada — SEO catalog automation

on:
  workflow_dispatch:
    inputs:
      run_live:
        description: 'Exécuter la vraie automation (danger) — par défaut non actif.'
        required: false
        default: 'false'
        type: boolean
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: carokaz-seo-${{ github.ref }}
  cancel-in-progress: true

env:
  SHOPIFY_SHOP: edr2dn-dx.myshopify.com
  SHOPIFY_API_VERSION: '2026-07'
  SITE_URL: https://carokazmada.com
  GSC_SITE_URL: sc-domain:carokazmada.com
  NO_COLOR: '1'
  SEO_AUDIT_PATHS: "/,/collections/vehicules-disponibles,/collections/fiara-vaovao,/collections/citadines,/collections/suv,/collections/4x4,/collections/pick-up,/blogs/actualites"

jobs:
  validate-python:
    name: Validation Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: carokaz-autoconfig
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Installer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: carokaz-autoconfig/requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier la syntaxe Python
        run: |
          python -m compileall .
          python -m py_compile carokaz_setup.py

  dry-run-seo:
    name: Dry run SEO audit
    needs: validate-python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: carokaz-autoconfig
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Installer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: carokaz-autoconfig/requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Exécuter le dry-run
        run: |
          python carokaz_setup.py --all --dry-run || true

      - name: Upload rapport dry-run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: carokaz-dryrun-${{ github.run_number }}
          path: carokaz-autoconfig/rapports/
          if-no-files-found: warn
          retention-days: 30

  preflight-live:
    name: Préflight live mode
    needs: dry-run-seo
    runs-on: ubuntu-latest
    outputs:
      allow_live: ${{ steps.check.outputs.allow_live }}
    steps:
      - name: Vérifier les conditions de lancement live
        id: check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.run_live }}" == "true" ]]; then
            echo "allow_live=true" >> "$GITHUB_OUTPUT"
          else
            echo "allow_live=false" >> "$GITHUB_OUTPUT"
          fi

  live-run:
    name: Live automation
    needs: preflight-live
    if: needs.preflight-live.outputs.allow_live == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: carokaz-autoconfig
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Installer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: carokaz-autoconfig/requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier les secrets requis
        env:
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SHOPIFY_ADMIN_TOKEN" ] && [ -z "$META_PAGE_ID" ] && [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Aucun secret requis détecté. Lancement live annulé."
            exit 1
          fi
          echo "Secrets détectés. Vérification préflight OK."

      - name: Exécuter l’automation live
        env:
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python carokaz_setup.py --all

      - name: Upload rapport live
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: carokaz-live-${{ github.run_number }}
          path: carokaz-autoconfig/rapports/
          if-no-files-found: warn
          retention-days: 30
