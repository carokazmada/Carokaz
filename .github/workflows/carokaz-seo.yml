name: Carokaz Mada — SEO catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  SHOPIFY_SHOP: carokazmada-store.myshopify.com
  SHOPIFY_API_VERSION: "2025-07"
  SITE_URL: https://carokazmada.com
  NO_COLOR: "1"

jobs:
  seo-catalogue:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carokaz-autoconfig
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: carokaz-autoconfig/requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Exécuter l’hygiène SEO Shopify
        env:
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
        run: python carokaz_setup.py --only T2,T5,T8

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carokaz-seo-rapport-${{ github.run_number }}
          path: carokaz-autoconfig/rapports/
          if-no-files-found: warn
          retention-days: 30
