name: ECM — validation statique sans publication
on:
  pull_request:
    paths: ['cloudflare-site/**', '.github/workflows/ecm-preflight.yml']
  push:
    branches: ['fix/ecm-audit-20261021']
    paths: ['cloudflare-site/**', '.github/workflows/ecm-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s cloudflare-site/tests -p 'test_*.py'
      - run: python3 -m py_compile cloudflare-site/scripts/live_audit.py
      - name: État de préparation à la publication (informatif, sans déploiement)
        run: python3 cloudflare-site/scripts/publication_gate.py
      - run: node --check cloudflare-site/app.js
      - name: Candidat production
        run: python3 cloudflare-site/scripts/verify.py
        env:
          CF_PAGES_BRANCH: main
      - name: Prévisualisation protégée
        run: python3 cloudflare-site/scripts/verify.py
        env:
          CF_PAGES_BRANCH: fix/ecm-audit-20261021
