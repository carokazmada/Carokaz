name: ECM — validation statique sans publication
on:
  pull_request:
    paths: ['cloudflare-site/**', '.github/workflows/ecm-preflight.yml']
  push:
    branches: ['fix/ecm-audit-20261021', 'automation/ecm-build-gates-20261021']
    paths: ['cloudflare-site/**', '.github/workflows/ecm-preflight.yml']
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Tests et protections anti-régression
        run: python3 -m unittest discover -s cloudflare-site/tests -p 'test_*.py'
      - name: Syntaxe Python et JavaScript
        run: |
          python3 -m py_compile cloudflare-site/scripts/verify.py cloudflare-site/scripts/check_build.py cloudflare-site/scripts/live_audit.py
          node --check cloudflare-site/app.js
      - name: Candidat de production — validation sans publication
        env:
          CF_PAGES_BRANCH: main
        run: |
          python3 cloudflare-site/scripts/verify.py
          python3 cloudflare-site/scripts/check_build.py --mode production
      - name: Prévisualisation protégée — validation sans publication
        env:
          CF_PAGES_BRANCH: ecm-ci-preview
        run: |
          python3 cloudflare-site/scripts/verify.py
          python3 cloudflare-site/scripts/check_build.py --mode preview
