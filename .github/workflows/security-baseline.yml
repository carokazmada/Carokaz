name: Security baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: carokaz-autoconfig
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: carokaz-autoconfig/requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt pip-audit
      - name: Dependency audit
        run: pip-audit -r requirements.txt --strict
      - name: Compile Python
        run: python -m compileall -q .
      - name: Reject tracked secret-like files
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          if git ls-files -z | grep -zE '(^|/)\.env$|(^|/).*(secret|credential|private|service-account|\.pem|\.key)' >/dev/null; then
            echo 'A secret-like file is tracked.' >&2
            exit 1
          fi
