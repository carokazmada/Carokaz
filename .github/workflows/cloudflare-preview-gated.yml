name: Carokaz Mada — Cloudflare preview sécurisé

on:
  push:
    branches:
      - preparation/cloudflare-contact-automatisation-20261012
    paths:
      - "cloudflare-site/**"
      - ".github/workflows/cloudflare-preview-gated.yml"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Saisir PREVIEW pour un déploiement d'essai (jamais production)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: carokaz-cloudflare-preview
  cancel-in-progress: false

jobs:
  verification:
    name: Vérifier le site sans publier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configurer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Contrôles de la vitrine
        run: python3 cloudflare-site/scripts/verify.py

  preparation-deploiement:
    name: Prévisualisation Cloudflare autorisée seulement
    needs: verification
    if: ${{ (github.event_name == 'push' && vars.CAROKAZ_CLOUDFLARE_PREVIEW_AUTO == 'true') || (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'PREVIEW') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Vérifier le compte et protéger la production
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")
          token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          if not account or not token:
              sys.exit("BLOQUÉ : secrets Cloudflare non configurés ; aucun déploiement.")
          project_name = "carokazmada"
          req = urllib.request.Request(
              "https://api.cloudflare.com/client/v4/accounts/" + account + "/pages/projects/" + project_name,
              headers={"Authorization": "Bearer " + token, "Accept": "application/json"}
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  payload = json.load(response)
          except Exception as exc:
              sys.exit("BLOQUÉ : connexion Cloudflare impossible ; " + type(exc).__name__)
          project = payload.get("result") or {}
          if not payload.get("success") or project.get("name") != project_name:
              sys.exit("BLOQUÉ : projet Cloudflare non confirmé.")
          production = project.get("production_branch")
          if not production or production == "carokaz-validation":
              sys.exit("BLOQUÉ : branche de production inconnue ou identique à l'aperçu.")
          print("Projet existant reconnu ; déploiement de test isolé autorisé.")
          PY
      - name: Préparer uniquement les fichiers du site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cloudflare-output-preview
          for file in index.html 404.html style.css robots.txt _headers catalogue.json; do
            cp "cloudflare-site/$file" "cloudflare-output-preview/$file"
          done
          test -s cloudflare-output-preview/index.html
          test -s cloudflare-output-preview/robots.txt
      - name: Envoyer uniquement la branche de test
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cloudflare-output-preview --project-name=carokazmada --branch=carokaz-validation
