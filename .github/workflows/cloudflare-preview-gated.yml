name: Carokaz Mada - Deploiement Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - preparation/cloudflare-contact-automatisation-20261012
    paths:
      - "cloudflare-site/**"
      - ".github/workflows/cloudflare-preview-gated.yml"

permissions:
  contents: read

concurrency:
  group: carokaz-cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    name: Verifier puis deployer Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Tests locaux
        run: python3 cloudflare-site/scripts/verify.py
      - name: Verifier les identifiants et le projet Cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: "07d0d1d1dba2f6b0fb777596eadb4037"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")
          token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          if not account or not token:
              sys.exit("::error::Ajouter le secret GitHub Actions CLOUDFLARE_API_TOKEN (Cloudflare Pages Edit). Aucun deploiement effectue.")
          req = urllib.request.Request(
              "https://api.cloudflare.com/client/v4/accounts/" + account + "/pages/projects/carokazmada",
              headers={"Authorization": "Bearer " + token, "Accept": "application/json"}
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  payload = json.load(response)
          except Exception as error:
              sys.exit("BLOCKED: Cloudflare project inaccessible: " + type(error).__name__)
          project = payload.get("result") or {}
          if not payload.get("success") or project.get("name") != "carokazmada":
              sys.exit("BLOCKED: wrong Cloudflare project")
          prod_branch = project.get("production_branch")
          if prod_branch != "main":
              sys.exit("BLOCKED: production branch differs from verified main")
          if project.get("source") is not None:
              sys.exit("BLOCKED: Cloudflare project is no longer Direct Upload")
          if project.get("subdomain") != "carokazmada.pages.dev":
              sys.exit("BLOCKED: unexpected Cloudflare subdomain")
          if sorted(project.get("domains") or []) != ["carokazmada.pages.dev"]:
              sys.exit("BLOCKED: unexpected custom domain; do not deploy")
          print("Projet Cloudflare Direct Upload verifie.")
          PY
      - name: Préparer le dossier statique pour preview
        run: |
          mkdir -p cloudflare-output-preview
          for file in index.html 404.html style.css robots.txt _headers catalogue.json; do
            cp "cloudflare-site/$file" "cloudflare-output-preview/$file"
          done
          test -s cloudflare-output-preview/index.html
      - name: Deployer main en production et la preparation en preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "07d0d1d1dba2f6b0fb777596eadb4037"
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            deploy_branch=main
          elif [ "$GITHUB_REF" = "refs/heads/preparation/cloudflare-contact-automatisation-20261012" ]; then
            deploy_branch=carokaz-validation
          else
            echo "::error::Branche non autorisee"
            exit 1
          fi
          npx --yes wrangler@4 pages deploy cloudflare-output-preview --project-name=carokazmada --branch="$deploy_branch" --commit-hash="$GITHUB_SHA"
          echo "Deploiement Cloudflare termine : $deploy_branch ($GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
      - name: Signaler un deploiement incomplet
        if: failure()
        run: |
          echo "Echec : le deploiement Cloudflare n'est pas confirme. Consulter la premiere etape en erreur." >> "$GITHUB_STEP_SUMMARY"
