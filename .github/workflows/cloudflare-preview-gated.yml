name: Carokaz Mada - Tests avant previsualisation Git

on:
  push:
    branches:
      - preparation/cloudflare-contact-automatisation-20261012
    paths:
      - "cloudflare-site/**"
      - ".github/workflows/cloudflare-preview-gated.yml"

permissions:
  contents: read

concurrency:
  group: carokaz-cloudflare-preview-checks
  cancel-in-progress: true

jobs:
  verify:
    name: Verifier le site de preparation sans deployer avec Actions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lire le depot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Installer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Verification statique
        run: python3 cloudflare-site/scripts/verify.py
      - name: Etat des connexions
        run: |
          echo "Cloudflare Pages est connecte directement a GitHub pour les builds et previews."
          echo "Ce job GitHub ne publie rien et n'utilise aucun jeton Cloudflare."
          echo "Production main non modifiee."
